name: Windows x64

on:
  push:
    branches: [master, "feat/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      bundle_tools:
        description: Include Windows download tools in the portable package
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    name: Test and build portable app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build portable Windows package
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.bundle_tools)
        run: ./scripts/build_windows.ps1 -DownloadTools
      - name: Upload build for inspection
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.bundle_tools)
        uses: actions/upload-artifact@v4
        with:
          name: SuperYTDownloader-windows-x64
          path: |
            dist/SuperYTDownloader-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SuperYTDownloader-windows-x64
          path: dist
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Super YT Downloader $RELEASE_TAG" \
              --notes-file CHANGELOG.md
          fi
          gh release upload "$RELEASE_TAG" \
            dist/SuperYTDownloader-windows-x64.zip \
            dist/SHA256SUMS.txt \
            --clobber
