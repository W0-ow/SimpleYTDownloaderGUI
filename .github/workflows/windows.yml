name: Windows checks and portable build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_tools:
        description: Download tools and build the Windows portable ZIP
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build portable package
        if: github.event_name == 'workflow_dispatch' && inputs.bundle_tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_windows.ps1 -DownloadTools
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.bundle_tools
        with:
          name: SuperYTDownloader-windows-x64
          path: dist/SuperYTDownloader-windows-x64.zip
          if-no-files-found: error
