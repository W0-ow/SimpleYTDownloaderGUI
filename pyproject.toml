[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "superyt-downloader"
version = "0.2.0"
description = "Interfaz de escritorio para yt-dlp, orientada a Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6.11,<7", "yt-dlp>=2025.11.12"]

[project.gui-scripts]
superyt = "superyt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
superyt = ["assets/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
